# Конфиг объекта мониторинга (книга). Аналог «объекта» в системах медиамониторинга.
# Скопируй в config/<slug>.yaml и заполни под свою книгу.
#
# Пример заполнен на публичной классике — так первый прогон точно вернёт упоминания
# и видно, что коннекторы живы. Заменяй на свою книгу целиком, включая якоря.

title: "Мастер и Маргарита"
subtitle: ""
authors:
  - "Михаил Булгаков"
publisher: "<твоё издательство>"
isbn: ""

# Якоря-дизамбигуаторы: упоминание засчитывается, если рядом с названием есть один из них.
# Решают проблему ОМОНИМА — когда название книги совпадает с названием фильма, спектакля,
# сериала, госпроекта или бренда. Ставь сюда фамилию автора, имя издательства, подзаголовок,
# имя героя — всё, что встречается рядом с книгой и не встречается рядом с однофамильцем.
anchors:
  - "Булгаков"
  - "Воланд"
  - "<твоё издательство>"

# Минус-слова: если есть в тексте И нет ни одного якоря — упоминание отбрасывается.
# Сюда идут те самые омонимы, которые ты нашёл, посмотрев первую выдачу глазами.
exclude:
  - "сериал"
  - "спектакль"
  - "экранизация"

# Поисковые запросы (точная фраза в кавычках + варианты с автором).
queries:
  - '"Мастер и Маргарита" Булгаков'
  - 'Булгаков "Мастер и Маргарита" издание'

# Какие каналы включить (имена файлов в scripts/connectors/ без .py).
# Каналы, которым нужен платный ключ, помечены в SKILL.md — убери лишние, чтобы не тратить кредиты.
channels:
  - media_googlenews
  - media_serpapi
  - social_vk
  - social_dzen
  - social_telegram
  - social_rsshub
  - readers_livelib
  - readers_marketplaces
  - video_youtube
  - social_scrapecreators
  - demand_wordstat

# Telegram-каналы издательства/автора для RSSHub (соц-мониторинг). Свои, без @.
telegram_channels: []

# YouTube-каналы, которые заведомо про омоним, а не про книгу (хэндлы с @ или без).
exclude_channels: []

# Период (для инкрементального режима — только новое с last_run).
period: { mode: incremental, days: 365 }

# Дайджест/алерты
digest:
  telegram_chat: ""        # куда слать дайджест (chat_id или @username), пусто = не слать
  alert_on_negative: true  # мгновенный пуш при тональности Негатив
